<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Display Square</title>
    <style>
        .image-container {
            width: 200px;
            height: 200px;
            border: 2px dashed #ccc;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px auto;
            background-color: #f9f9f9;
        }

        .image-container img {
            max-width: 100%;
            max-height: 100%;
        }
    </style>
</head>
<body>
<!-- Upload Form -->
    <form  action="{{url_for('show_color',image=image)}}" method="POST" enctype="multipart/form-data" class="mb-4">
        <div class="mb-3">
            <input class="form-control" type="file" name="image" accept="static/*" required>
        </div>
        <button class="btn btn-primary" type="submit">Upload Image</button>
    </form>
